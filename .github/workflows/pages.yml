# Publishes the app to GitHub Pages and refreshes the feeds a browser cannot read directly
# (FAA, AWS, Azure). Requires: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy outage map
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *' # GitHub may run this late; the app shows how old the snapshot is
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js vendor assets _site/
      - name: Snapshot live feeds
        run: node scripts/snapshot.js _site
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
